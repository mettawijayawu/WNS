name: PHP Build and Test

# Menentukan kapan action ini berjalan (contoh: saat ada push atau pull request di branch main)
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  php-steps:
    runs-on: ubuntu-latest

    steps:
    # 1. Mengambil kode dari repositori GitHub
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Setup Versi PHP yang diinginkan
    - name: Setup PHP Environment
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2' # Ubah sesuai versi PHP proyek Anda
        extensions: mbstring, intl, pdo_mysql # Tambahkan ekstensi jika diperlukan
        tools: composer:v2

    # 3. Menginstal Dependensi Composer (jika ada)
    - name: Install Composer Dependencies
      run: composer install --prefer-dist --no-progress

    # 4. Menjalankan Script PHP Anda (Contoh: Menjalankan file utama atau Unit Test)
    - name: Run PHP Script
      run: php index.php # Ganti dengan perintah jalankan aplikasi atau vendor/bin/phpunit jika ingin testing
